[package]
name = "strategy_engine_core"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "strategy_engine_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "strategy_engine"
path = "src/main.rs"

[dependencies]
pyo3 = "0.28.0"
numpy = "0.28.0"
burn = { version = "0.20.0", features = ["std", "autodiff", "candle"], default-features = false }
indicatif = { version = "0.18.3", features = ["rayon"] }
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
strum = "0.27.1"
strum_macros = "0.27.1"
toml = "0.8.22"
crossterm = "0.27"


# Optimization settings for release profile
[profile.release]
lto = true            # Enables Link-Time Optimization (LTO)
codegen-units = 1     # Reduces the number of codegen units, improves optimization but may increase compilation time
opt-level = 3         # Maximizes optimization for performance
